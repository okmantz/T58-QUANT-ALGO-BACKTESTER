{# Shared <head> boilerplate for every full page (charset, viewport, PWA/icon links, theme.css and the
   saved-theme bootstrap). The bootstrap runs before first paint so every page -- including the job/progress
   pages that have no sidebar -- follows the Light/Dark choice made in the sidebar toggle. #}
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/manifest.json">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="T58 Backtester">
<script src="/static/t58-pwa.js" defer></script>
<script src="/static/t58-metrics.js" defer></script>
<link rel="icon" href="/static/icon-192.png">
<link rel="apple-touch-icon" href="/static/icon-192.png">
<meta name="theme-color" content="#05070a">
<style>/* critical guard: keeps the page sane even if a stale stylesheet is served (zero specificity -- theme.css wins when fresh) */
:where(svg.lu){width:16px;height:16px;max-width:64px;max-height:64px;flex-shrink:0;display:block}
:where(.t58-scene-fx){position:fixed;top:0;right:0;bottom:0;left:0;z-index:-1;pointer-events:none;overflow:hidden}
:where(.t58-nav-icon svg){max-width:24px;max-height:24px}
</style>
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/ui-themes.css">
<link rel="stylesheet" href="/static/workspace-presets.css">
<script>try{if(localStorage.getItem('t58-theme')==='light')document.documentElement.setAttribute('data-theme','light')}catch(e){}</script>
<script>try{var b=localStorage.getItem('t58-bg'),L=(window.__T58_LOCKED||{}).bg||[];if(b&&b!=='mountains'&&L.indexOf(b)<0)document.documentElement.setAttribute('data-bg',b)}catch(e){}</script>
<script>/* interface theme (unlockable), painted before first paint; every theme sits on the dark base */
try{var ut=localStorage.getItem('t58-ui-theme'),UL=(window.__T58_LOCKED||{}).theme||[];if(ut&&UL.indexOf(ut)<0&&/^(obsidian-gold|midnight-azure|terminal-green|deep-space|crimson-protocol)$/.test(ut)){var h=document.documentElement;h.setAttribute('data-ui-theme',ut);h.removeAttribute('data-theme')}}catch(e){}</script>
<script>/* workspace preset (unlockable), painted before first paint; t58-personalize.js owns the logic */
try{var ws=localStorage.getItem('t58-ws'),WL=(window.__T58_LOCKED||{}).ws||[];if(ws&&WL.indexOf(ws)<0&&/^(obsidian|cyberpunk|nordic|evergreen|sovereign)$/.test(ws)){var hh=document.documentElement;hh.setAttribute('data-ws',ws);hh.removeAttribute('data-theme')}}catch(e){}</script>
<script>/* accent colour, painted before first paint (t58-personalize.js owns the logic and refreshes this cache) */
try{var a=localStorage.getItem('t58-accent');if(a&&a!=='teal'){var v=JSON.parse(localStorage.getItem('t58-accent-vars')||'null'),r=document.documentElement;if(v){var m=localStorage.getItem('t58-theme')==='light'?'light':'dark',o=v[m];for(var k in o)r.style.setProperty(k,o[k]);r.setAttribute('data-ui-accent',a)}}}catch(e){}</script>
<script src="/static/t58-scene-canvas.js" defer></script>
<script src="/static/t58-personalize.js" defer></script>
