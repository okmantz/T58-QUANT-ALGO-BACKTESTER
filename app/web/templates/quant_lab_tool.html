<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T58 Quant Lab -- {{ title }}</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<link rel="stylesheet" href="/static/theme.css">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  .card { background: var(--panel-2); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 14px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-muted); margin: 0 0 10px; }
  .card p.help { font-size: 12.5px; color: var(--text-muted); margin: 0 0 14px; line-height: 1.5; }
  label { display: block; font-size: 13px; color: #ccc; margin: 10px 0 4px; }
  input[type=text], input[type=number], select, textarea {
    width: 100%; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border-light);
    background: var(--panel-3); color: var(--text); font-size: 14px;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), 0.15); }
  textarea { min-height: 100px; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 140px; }
  .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 12px 0 4px; }
  .checkbox-row input { width: auto; }
  .submit-btn {
    width: 100%; padding: 13px; border-radius: 10px; border: 1px solid var(--teal); background: var(--teal);
    color: #04120e; font-weight: 700; font-size: 14px; margin-top: 14px; cursor: pointer;
  }
  .result-ok { border-left: 3px solid var(--teal); }
  .result-error { border-left: 3px solid var(--coral); color: var(--coral); white-space: pre-wrap; font-size: 13px; }
  pre.result-summary { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: var(--text); margin: 0; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p.lede { color: var(--text-muted); font-size: 13px; margin: 0 0 16px; }
  a.back-link { color: var(--text-muted); font-size: 12.5px; text-decoration: none; }
  a.back-link:hover { color: var(--teal); }
</style>
</head>
<body>
{% set active_page = 'quant_lab' %}
<div class="t58-shell">
{% include '_sidebar.html' %}
<div class="t58-main">
  <a class="back-link" href="/quant-lab">&larr; Quant Lab</a>
  <h1>{{ title }}</h1>
  <p class="lede">{{ description }}</p>

  <form method="POST" enctype="multipart/form-data">
    <div class="card">
      <h2>Inputs</h2>
      {{ form_html|safe }}
      <button class="submit-btn" type="submit">Run</button>
    </div>
  </form>

  {% if error %}
  <div class="card result-error">{{ error }}</div>
  {% elif result_html %}
  <div class="card result-ok">
    <h2>Result</h2>
    {{ result_html|safe }}
  </div>
  {% endif %}
</div>
</div>
<script src="/static/t58-chrome.js" defer></script>
</body>
</html>
