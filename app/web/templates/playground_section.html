<!DOCTYPE html>
<html lang="en">
<head>
<title>{{ meta.title }} — Playground — T58 Quant Algo Backtester</title>
{% include '_head_common.html' %}
<link rel="stylesheet" href="/static/pg.css">
</head>
<body>
{% set active_page = 'playground' %}
<div class="t58-shell">
{% include '_sidebar.html' %}
<div class="t58-main"><div class="pg">
<div class="t58-page-header">
  <h1><a href="/playground" style="color:var(--text-muted);text-decoration:none">Playground</a> / {{ meta.title }}</h1>
  <p>{{ meta.blurb }} Runs entirely in the app, works offline.</p>
</div>
<div id="pg-root"></div>
</div></div></div>
<script src="/static/pg-common.js"></script>
{% if section in ('arcade', 'puzzles') %}<script src="/static/pg-chess-core.js"></script>{% endif %}
<script src="/static/pg-{{ section }}.js"></script>
<script>PG.page('{{ section }}', document.getElementById('pg-root'));</script>
</body>
</html>
