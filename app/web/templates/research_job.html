<!DOCTYPE html>
<html lang="en">
<head>
<title>Research Director Job — T58 Quant Algo Backtester</title>
{% include '_head_common.html' %}
<link rel="stylesheet" href="/static/job-theme.css">
</head>
<body>
<header><h1><span class="mark"></span>T58 — Research Director</h1></header>
<nav>
  <a href="/dashboard" class="back-btn">&larr; Back</a>
  <a href="/research">New Research Run</a>
</nav>
<main>

{% if not_found %}
<div class="error">Job "{{ job_id }}" was not found (the server may have restarted since it ran).</div>
{% else %}

<div class="card">
  <h2 id="status-title"><span class="spinner" id="spinner"></span>Running research analyses&hellip;</h2>
  <div id="log">Starting&hellip;</div>
</div>

<div class="card" id="results-card" style="display:none;">
  <h2>Results</h2>
  <div id="results"></div>
  <p><a href="/research">Run another analysis</a></p>
</div>

<script>
const jobId = "{{ job_id }}";
let pollTimer = null;

async function poll() {
  try {
    const resp = await fetch(`/api/job/${jobId}`);
    const job = await resp.json();
    const logEl = document.getElementById('log');
    if (job.log && job.log.length) {
      logEl.innerHTML = job.log.map(l => `<div>${l}</div>`).join('');
      logEl.scrollTop = logEl.scrollHeight;
    }
    if (job.status === 'done') {
      clearInterval(pollTimer);
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status-title').textContent = 'Research complete';
      const rc = document.getElementById('results-card');
      rc.style.display = 'block';
      const r = job.results || {};
      const names = {
        decomposition: 'Edge Decomposition',
        ablation: 'Ablation Test',
        null_baselines: 'Null Baselines',
        degradation: 'Signal Degradation',
        contribution: 'Trade Contribution',
        conditional: 'Conditional Expectancy',
        regime: 'Regime Discovery',
      };
      let html = '';
      for (const [key, label] of Object.entries(names)) {
        if (r[key]) {
          const v = r[key].verdict || JSON.stringify(r[key]).slice(0, 200);
          html += `<div class="result-row"><h3>${label}</h3><p>${v}</p></div>`;
        }
      }
      document.getElementById('results').innerHTML = html || '<p class="muted">No analyses were selected.</p>';
    } else if (job.status === 'failed') {
      clearInterval(pollTimer);
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('status-title').textContent = 'Research failed';
      logEl.innerHTML += `<div class="error">${job.error || 'Unknown error'}</div>`;
    }
  } catch (e) {
    console.error('poll failed', e);
  }
}
pollTimer = setInterval(poll, 2000);
poll();
</script>

{% endif %}
</main>
</body>
</html>
