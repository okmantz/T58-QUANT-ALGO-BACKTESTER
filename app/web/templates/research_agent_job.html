<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Research Agent Job — T58 Quant Algo Backtester</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#05070a">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/job-theme.css">
</head>
<body>
<header><h1>T58 Quant Algo Backtester — Research Agent</h1></header>
<nav>
  <a href="/">Run &amp; Report</a>
  <a href="/research-agent">New Question</a>
</nav>
<main>

{% if not_found %}
<div class="error">Job "{{ job_id }}" was not found (the server may have restarted since it ran).</div>
{% else %}

<div class="card">
  <h2 id="status-title"><span class="spinner" id="spinner"></span>Agent working&hellip;</h2>
  <div id="log">Starting&hellip;</div>
</div>

<div id="steps"></div>

<div class="card" id="answer-card" style="display:none;">
  <h2>Final answer</h2>
  <div class="final-answer" id="final-answer"></div>
</div>

<div class="error" id="error-card" style="display:none;"></div>

{% endif %}
</main>

{% if not not_found %}
<script>
  const jobId = {{ job_id | tojson }};

  function renderSteps(steps) {
    const container = document.getElementById('steps');
    container.innerHTML = '';
    (steps || []).forEach(s => {
      const div = document.createElement('div');
      div.className = 'card step';
      let html = `<div class="thought"><b>Step ${s.step_index}</b> — ${s.thought || ''}</div>`;
      if (s.action) html += `<div class="action">${s.action}(${JSON.stringify(s.action_input || {})})</div>`;
      if (s.observation) html += `<div class="observation">${JSON.stringify(s.observation, null, 2).slice(0, 2000)}</div>`;
      if (s.note) html += `<div class="thought" style="color:#ffcf7a;">${s.note}</div>`;
      div.innerHTML = html;
      container.appendChild(div);
    });
  }

  function poll() {
    fetch(`/research-agent/job/${jobId}/status.json`)
      .then(r => r.json())
      .then(data => {
        if (!data.found) return;
        document.getElementById('log').textContent = data.log.filter(Boolean).join('\n');
        document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;

        if (data.error) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('status-title').textContent = 'Agent failed';
          const ec = document.getElementById('error-card');
          ec.style.display = 'block';
          ec.textContent = data.error;
          return;
        }

        if (data.done) {
          document.getElementById('spinner').style.display = 'none';
          document.getElementById('status-title').textContent = 'Agent finished';
          const s = data.summary;
          if (s) {
            renderSteps(s.steps);
            if (s.error) {
              const ec = document.getElementById('error-card');
              ec.style.display = 'block';
              ec.textContent = s.error;
            } else if (s.final_answer) {
              document.getElementById('answer-card').style.display = 'block';
              document.getElementById('final-answer').textContent = s.final_answer;
            } else {
              document.getElementById('answer-card').style.display = 'block';
              document.getElementById('final-answer').textContent = `Stopped without a final answer (${s.stopped_reason || 'unknown reason'}). See the steps above for what it tried.`;
            }
          }
          return;
        }
        setTimeout(poll, 2000);
      })
      .catch(() => setTimeout(poll, 3000));
  }
  poll();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/static/sw.js').catch(() => {});
  }
</script>
{% endif %}
</body>
</html>
