<!DOCTYPE html>
<html lang="en">
<head>
<title>Locked — T58 Quant Algo Backtester</title>
{% include '_head_common.html' %}
<style>
  * { box-sizing: border-box; }
  /* The card lives in its own fixed, self-centring layer: nothing injected into <body> (backdrop scene, verse bar, avatar...) can
     push it around, and a short window scrolls instead of clipping. */
  html, body { height: 100%; margin: 0; }
  .gate-wrap { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2; overflow-y: auto; display: flex; padding: 20px; }
  .gate-wrap > form { margin: auto; }
  .lock-card {
    background: var(--panel-2); border: 1px solid var(--border); border-radius: 14px;
    padding: 28px 26px; width: 100%; max-width: 340px; text-align: center;
    box-shadow: 0 24px 60px -18px rgba(0, 0, 0, .65);
  }
  html:not([data-theme="light"]) .lock-card { background: rgba(8, 20, 24, .78); -webkit-backdrop-filter: blur(14px) saturate(1.2); backdrop-filter: blur(14px) saturate(1.2); border-color: rgba(130, 235, 220, .16); }
  .lock-icon { font-size: 30px; margin-bottom: 6px; }
  h1 { font-size: 16px; margin: 0 0 4px; color: var(--text); }
  p.lede { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }
  input[type=password] {
    width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border-light);
    background: var(--panel-3); color: var(--text); font-size: 15px; text-align: center;
  }
  input:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 3px rgba(var(--teal-rgb), 0.15); }
  .submit-btn {
    width: 100%; padding: 13px 20px; border-radius: 10px; border: 1px solid var(--teal); background: var(--teal);
    color: var(--on-teal); font-weight: 700; font-size: 14px; margin-top: 14px; cursor: pointer;
  }
  .error-note { color: var(--danger); font-size: 13px; margin: 12px 0 0; }
</style>
</head>
<body>
  <div class="gate-wrap">
  <form class="lock-card" method="POST" action="/lock/unlock">
    <div class="lock-icon">&#128274;</div>
    <h1>This app is locked</h1>
    <p class="lede">Enter the local app password to continue.</p>
    <input type="password" name="password" autocomplete="current-password" autofocus placeholder="Password">
    <input type="hidden" name="next" value="{{ next }}">
    <button class="submit-btn" type="submit">Unlock</button>
    {% if error %}<p class="error-note">{{ error }}</p>{% endif %}
  </form>
  </div>
</body>
</html>
