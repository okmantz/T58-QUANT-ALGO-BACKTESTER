<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Optimize (pick engines) — job — T58 Quant Algo Backtester</title>
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/static/icon-192.png">
<meta name="theme-color" content="#05070a">
<link rel="stylesheet" href="/static/theme.css">
<link rel="stylesheet" href="/static/job-theme.css">
</head>
<body>
<header><h1>T58 Quant Algo Backtester — Optimize (pick engines)</h1></header>
<nav>
  <a href="/dashboard" class="back-btn">&larr; Back</a>
  <a href="/optimize-simple">New Run</a>
</nav>
<main>

{% if not_found %}
<div class="error">Job "{{ job_id }}" was not found (the server may have restarted since it ran).</div>
{% else %}

<div class="card">
  <h2 id="status-title"><span class="spinner" id="spinner"></span>Optimize running&hellip;</h2>
  <div id="log">Starting&hellip;</div>
  <button type="button" id="stop-btn" style="margin-top:12px; padding:10px 22px; border-radius:10px; border:1px solid #6b2323; background:#3a1616; color:#ffb4b4; font-size:14px; font-weight:700; cursor:pointer;" onclick="stopPolling()">Stop watching</button>
</div>

<div class="card" id="summary-card" style="display:none;">
  <h2>Engine results</h2>
  <div id="summary-body"></div>
</div>

<script>
const JOB_ID = {{ job_id | tojson }};
let stopped = false;
function stopPolling(){ stopped = true; document.getElementById('stop-btn').disabled = true; }
function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }
function renderSummary(summary){
  const body = document.getElementById('summary-body');
  if (!summary) { body.innerHTML = '<p class="note">No summary recorded.</p>'; return; }
  let html = '';
  for (const [engine, r] of Object.entries(summary)) {
    html += '<h3>' + esc(engine) + '</h3>';
    if (r.error) { html += '<p class="note">Failed: ' + esc(r.error) + '</p>'; continue; }
    if (r.linked) {
      html += '<p>This engine keeps its own page: <a href="' + esc(r.url) + '">' + esc(r.label) + '</a></p><p class="note">' + esc(r.note || '') + '</p>';
      continue;
    }
    html += '<table>';
    for (const [k, v] of Object.entries(r)) {
      if (k === 'result') html += '<tr><td>' + esc(k) + '</td><td><pre>' + esc(v) + '</pre></td></tr>';
      else html += '<tr><td>' + esc(k) + '</td><td>' + esc(v) + '</td></tr>';
    }
    html += '</table>';
  }
  body.innerHTML = html;
}
async function poll(){
  if (stopped) return;
  try {
    const res = await fetch('/optimize-simple/job/' + JOB_ID + '/status.json');
    const data = await res.json();
    const logEl = document.getElementById('log');
    logEl.innerHTML = (data.log || []).map(esc).join('<br>');
    logEl.scrollTop = logEl.scrollHeight;
    if (data.done) {
      document.getElementById('spinner').style.display = 'none';
      document.getElementById('stop-btn').style.display = 'none';
      document.getElementById('status-title').textContent = data.error ? 'Optimize finished with errors' : 'Optimize finished';
      document.getElementById('summary-card').style.display = 'block';
      renderSummary(data.summary);
      return;
    }
  } catch (e) { /* keep polling through transient errors */ }
  setTimeout(poll, 1500);
}
poll();
</script>
{% endif %}

</main>
{% include '_project_chat_embed.html' %}
</body>
</html>
