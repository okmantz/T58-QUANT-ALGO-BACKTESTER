[project]
name = "t58-quant-algo-backtester"
version = "1.0.0"
description = "MVP desktop app for backtesting trading strategies against prop-firm evaluation rules and estimating probability of pass/payout via Monte Carlo simulation."
authors = [{name = "T58 Trading"}]
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0"
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (listed in tests/slow_tests.txt); skipped by the fast tier -- run them with `pytest` (no -m) or the full-tests workflow",
]
