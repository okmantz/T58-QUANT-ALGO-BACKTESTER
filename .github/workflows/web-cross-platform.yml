name: web-cross-platform

# THE web-app build: one workflow, one zip per OS.
#
#   test   full pytest suite on Linux (gates everything below)
#   build  Windows + macOS + Linux, each: install -> web tests -> start the real
#          server from source and request every page -> PyInstaller one-folder
#          build (build_tools/t58_web.spec) -> start the FROZEN app and request
#          its pages -> zip + sha256 (build_tools/package_release.py)
#
# Pull requests run test + the from-source smoke on all 3 OSes (fast).
# Pushes to main, version tags (v*) and manual runs also build the packages.
# A tag (v*) attaches the three zips + checksums to the GitHub release.
# Market data is a separate download: see build-data-pack.yml.

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

concurrency:
  group: web-cross-platform-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # attach release assets on tags

jobs:
  test:
    name: full test suite (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt pytest
      - name: Run the test suite
        run: pytest -q -p no:cacheprovider tests

  build:
    name: ${{ matrix.label }}
    needs: test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, label: Windows, platform: windows, exe: ".exe", symlinks: "" }
          - { os: macos-latest,   label: macOS,   platform: macos,   exe: "",     symlinks: "--follow-symlinks" }
          - { os: ubuntu-latest,  label: Linux,   platform: linux,   exe: "",     symlinks: "--follow-symlinks" }
    defaults:
      run:
        shell: bash
    env:
      PACKAGE: T58-Web-App-${{ matrix.label }}.zip
      T58_LICENSE_SERVER_URL: ${{ secrets.T58_LICENSE_SERVER_URL }}
      T58_MASTER_LICENSE_KEY_HASH: ${{ secrets.T58_MASTER_LICENSE_KEY_HASH }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install libomp (macOS, needed by lightgbm)
        if: matrix.platform == 'macos'
        run: brew install libomp
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt pyinstaller
      - name: Verify critical dependencies import
        run: python -c "import pandas, numpy, flask, alpaca, keyring, qrcode, requests, pyarrow, py7zr, pypdf, scipy, sklearn, lightgbm; print('All critical dependencies import OK')"
      - name: Verify repository structure
        run: |
          missing=0
          for p in run_web.py app/web/server.py app/web/launcher.py app/web/templates app/web/static \
                   build_tools/t58_web.spec build_tools/spec_common.py build_tools/package_release.py \
                   build_tools/frozen_smoke.py build_tools/bake_license_config.py config/pyproject.toml \
                   strategies scripts/web_smoke_test.py; do
            [ -e "$p" ] || { echo "MISSING: $p"; missing=1; }
          done
          [ "$missing" = 0 ] || exit 1
          echo "Repository structure OK"
      - name: Web, storage and startup tests
        run: >
          pytest -q -p no:cacheprovider
          tests/web/test_web.py tests/web/test_web_license_gate.py tests/data/test_storage.py
          tests/web/test_validate_hub_links.py tests/ui/test_startup_speed_and_desktop_parity.py
          tests/web/test_cross_platform_web.py tests/web/test_start_here_sections.py
      - name: Start the real server from source and request every main page
        run: python scripts/web_smoke_test.py

      # ---- packaging (not on pull requests) ----
      - name: Bake license build config
        if: github.event_name != 'pull_request'
        run: python build_tools/bake_license_config.py
      - name: Build the web app (PyInstaller)
        if: github.event_name != 'pull_request'
        run: pyinstaller --noconfirm --clean build_tools/t58_web.spec
      - name: Verify the build output
        if: github.event_name != 'pull_request'
        run: |
          test -f "dist/T58-Web-App/T58-Web-App${{ matrix.exe }}" || { echo "executable missing"; ls -la dist/T58-Web-App; exit 1; }
          test -d dist/T58-Web-App/_internal || { echo "_internal missing"; exit 1; }
          du -sh dist/T58-Web-App
      - name: Smoke-test the FROZEN app (start it, request its pages)
        if: github.event_name != 'pull_request'
        run: python build_tools/frozen_smoke.py web "dist/T58-Web-App/T58-Web-App${{ matrix.exe }}" 240
      - name: Code-sign (Windows, optional)
        if: github.event_name != 'pull_request' && matrix.platform == 'windows'
        shell: pwsh
        run: |
          $certB64 = "${{ secrets.SIGN_CERT }}"
          if ([string]::IsNullOrWhiteSpace($certB64)) { Write-Host "SIGN_CERT not set -- shipping UNSIGNED."; exit 0 }
          $pfx = Join-Path $env:RUNNER_TEMP "t58-sign-cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($certB64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue | Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found" }
            & $signtool sign /f $pfx /p "${{ secrets.SIGN_CERT_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\T58-Web-App\T58-Web-App.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)" }
          } finally { Remove-Item $pfx -Force -ErrorAction SilentlyContinue }
      - name: Create the zip + checksum
        if: github.event_name != 'pull_request'
        run: python build_tools/package_release.py app --dist dist/T58-Web-App --out "$PACKAGE" --platform ${{ matrix.platform }} ${{ matrix.symlinks }}
      - name: Upload package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: T58-Web-App-${{ matrix.label }}
          path: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
          compression-level: 0
          if-no-files-found: error
      - name: Attach to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.PACKAGE }}
            ${{ env.PACKAGE }}.sha256
