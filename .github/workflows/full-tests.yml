name: full-tests

# The COMPLETE test suite (fast + slow tests), run in parallel. It is deliberately separate from the build workflows
# so uploading files and building the apps never waits on it.
#
# Runs: every night, on version tags, on pull requests, and whenever you press "Run workflow".

on:
  schedule:
    - cron: "17 7 * * *"
  pull_request:
    branches: [ main ]
  push:
    tags: [ "v*" ]
  workflow_dispatch: {}

concurrency:
  group: full-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full:
    name: full suite (Linux, parallel)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          lfs: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install Tk (desktop UI tests)
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk xvfb
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt pytest pytest-xdist
      - name: Run every test
        run: xvfb-run -a pytest -q -p no:cacheprovider tests -n auto --durations=25
