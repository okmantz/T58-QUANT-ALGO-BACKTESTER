name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# FIX (2026-09, "CI has been running for over an hour" / "not normal"):
# with no concurrency group, every push queued its own full run of this
# workflow with nothing canceling the previous one -- so a few commits
# pushed back to back (exactly the "Add files via upload" pattern that
# triggered this fix) left SEVERAL of these sitting "in progress" at
# once, each competing for the same limited pool of hosted runners.
# Scoping the group to the branch and setting cancel-in-progress means a
# newer push cancels whatever stale run was still going for an older
# commit on the same branch, instead of both grinding along in parallel
# indefinitely.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # A real hang here should fail loudly, not run for hours (GitHub's own
    # default job timeout is 360 minutes -- indistinguishable from "stuck"
    # to anyone watching the Actions tab). This was originally set to 30,
    # but the suite has since grown (2000+ tests across all the family/
    # indicator expansion rounds, plus inherently slow background-job/
    # loop-mode tests -- Search Lab, Evolution Lab multi-instrument, Speed
    # Run, Forge, Overnight Autopilot) to the point where a normal, healthy
    # run now legitimately takes 25-30+ minutes on GitHub's hosted runners.
    # That left runs getting killed by the timeout itself (shown as
    # "cancelled", not "failure") rather than by any real problem --
    # 60 gives real headroom above the suite's actual current runtime
    # while still catching a genuine multi-hour hang.
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
      - name: Run tests
        run: pytest -q tests
