# build-data-pack -- the market-data download (data/raw/**), separate from the app.
#
# The app zips used to carry all of data/raw (~740 MB, mostly .parquet that does
# not compress), which made one huge download that failed to extract. The app is
# now small; the data is this one optional zip: extract it INTO the app folder
# so the files land in data\raw\<instrument>\... next to the .exe.
#
# Runs on Linux (no Windows runner needed) and only when data/raw or the
# packaging script changes, on a tag, or when started by hand.

name: build-data-pack

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
    paths:
      - "data/raw/**"
      - "build_tools/package_release.py"
      - ".github/workflows/build-data-pack.yml"
  workflow_dispatch: {}

concurrency:
  group: build-data-pack-${{ github.ref }}
  cancel-in-progress: true

jobs:
  data-pack:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build the market-data zip
        run: |
          set -euo pipefail
          python build_tools/package_release.py data --out T58-Market-Data.zip
          ls -la T58-Market-Data.zip T58-Market-Data.zip.sha256
          cat T58-Market-Data.zip.sha256

      - name: Verify the pack contains EVERY data/raw file
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess, zipfile
          tracked = [p for p in subprocess.check_output(["git", "ls-files", "data/raw"], text=True).splitlines()
                     if p and not p.endswith(".gitkeep")]
          inside = set(zipfile.ZipFile("T58-Market-Data.zip").namelist())
          missing = [p for p in tracked if p not in inside]
          print(f"data/raw files in git: {len(tracked)}  |  data files in the zip: {sum(n.startswith('data/raw/') for n in inside)}")
          if missing:
              raise SystemExit("MISSING FROM PACK: " + ", ".join(missing[:20]))
          print("OK: the pack contains every data/raw file")
          PY

      - name: Upload market-data pack
        uses: actions/upload-artifact@v6
        with:
          name: T58-Market-Data
          path: |
            T58-Market-Data.zip
            T58-Market-Data.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Attach market-data pack to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            T58-Market-Data.zip
            T58-Market-Data.zip.sha256
