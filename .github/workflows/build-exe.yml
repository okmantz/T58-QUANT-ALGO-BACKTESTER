name: build-exe

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch: {}

# FIX (2026-09, "this has been loading/compiling for over an hour --
# that's not normal"): see build.yml's own concurrency block for the
# full reasoning -- the short version is that several commits pushed
# close together used to each queue their own complete run of this
# workflow with nothing canceling the older, now-stale one.
concurrency:
  group: build-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FIX (2026-09, root cause of the hour-plus hangs): this workflow's
  # "Run test suite" gate against the FULL 2000+-test suite used to run
  # directly on windows-latest, inside the same job that then runs
  # PyInstaller. Windows runners are dramatically slower than Linux for
  # this kind of numpy/pandas-heavy workload (no manylinux wheels to
  # reuse as-is, slower filesystem/process-spawn overhead for a suite
  # this size), so a suite that takes 25-30+ minutes on Linux (see
  # build.yml, which already gates every push this same way -- and see
  # that workflow's own timeout-minutes comment for how that runtime has
  # grown as the suite grew) could take well over an hour here -- and
  # because the exe build itself couldn't even START until that finished,
  # the whole workflow sat "in progress" the entire time with no visible
  # sign of whether it was working or stuck. Splitting the test gate into
  # its OWN fast ubuntu-latest job that the Windows build job depends on
  # (needs:) keeps exactly the same protection (a red test suite still
  # blocks the release exe -- see the windows job's own comment) while
  # removing the slow-OS re-run entirely from the critical path.
  test:
    runs-on: ubuntu-latest
    # See build.yml's matching timeout-minutes comment: 30 was too tight
    # once the suite grew past ~2000 tests and started getting killed by
    # the timeout itself (shown as "cancelled") rather than by a real
    # failure. 60 gives real headroom.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install pytest
      - name: Run test suite
        run: pytest -q tests

  build-windows-exe:
    needs: test
    runs-on: windows-latest
    # The exe build itself (dependency install + PyInstaller packaging,
    # no test suite anymore -- see the `test` job above) should be well
    # under this; a real hang here now fails loudly instead of running
    # for hours.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          # pwsh does NOT stop on a failed native command (non-zero exit)
          # the way bash does -- a failing `pip install` here would
          # otherwise be silently ignored and the workflow would carry on
          # to build an .exe missing whatever didn't install (this is
          # exactly what happened when config/requirements.txt briefly had
          # an unsatisfiable version pin: pip failed, PyInstaller still
          # ran, and the resulting .exe crashed on first launch with
          # "No module named 'pandas'"). Check $LASTEXITCODE after every
          # pip call so a resolution failure stops the build immediately.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed (exit $LASTEXITCODE)" }
          pip install -r config/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install -r config/requirements.txt failed (exit $LASTEXITCODE) -- check for an unsatisfiable version pin" }
          pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "pip install pyinstaller failed (exit $LASTEXITCODE)" }

      - name: Verify critical dependencies actually imported
        shell: pwsh
        run: |
          # Belt-and-suspenders check: even if pip reports success, make
          # sure every package the app actually imports at runtime is
          # really importable before we spend time building an .exe out of
          # it. This would have caught the pandas-missing build instantly
          # instead of only surfacing when Owen launched the app.
          python -c "import pandas, numpy, flask, alpaca, keyring, qrcode, requests, pyarrow, py7zr, pypdf, scipy, sklearn, lightgbm; print('All critical dependencies import OK')"
          if ($LASTEXITCODE -ne 0) { throw "One or more required Python packages failed to import after installation -- building would produce a broken .exe. Check config/requirements.txt." }

      - name: Verify repository structure
        shell: pwsh
        run: |
          Write-Host "=== VERIFYING REPOSITORY ==="

          if (-not (Test-Path "run_app.py")) {
            Write-Error "run_app.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\main.py")) {
            Write-Error "app/main.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\ui\main_window.py")) {
            Write-Error "app/ui/main_window.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\ui\__init__.py")) {
            Write-Error "app/ui/__init__.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "data\raw")) {
            Write-Error "data/raw directory was NOT found."
            exit 1
          }

          Write-Host ""
          Write-Host "=== RAW DATA FILES ==="

          $rawFiles = Get-ChildItem "data\raw" -File -Recurse -ErrorAction SilentlyContinue

          if ($rawFiles.Count -eq 0) {
            Write-Warning "data/raw exists but contains no files."
          }
          else {
            Write-Host "Found $($rawFiles.Count) CSV file(s) under data/raw (including instrument subfolders):"
            $rawFiles | Select-Object FullName, Length
          }

          Write-Host ""
          Write-Host "=== UI FILES ==="
          Get-ChildItem "app\ui" -Recurse |
            Select-Object FullName, Length

      - name: Bake license build config
        shell: pwsh
        run: |
          # v7: generates app/licensing/build_config.py from the release
          # secrets (T58_LICENSE_SERVER_URL, T58_MASTER_LICENSE_KEY_HASH),
          # so the shipped .exe has a real license URL and a per-release
          # master-key hash instead of a placeholder / repo-baked hash.
          # Both secrets are OPTIONAL: absent values are left empty and
          # the app degrades loudly at startup (see app/licensing/client.py
          # and app/licensing/gate.py), never silently insecure.
          # Owen sets both once per repo: GitHub Settings -> Secrets and
          # variables -> Actions. Full checklist: license_server/DEPLOY.md.
          python -c "
          import json, os
          config = {
              'LICENSE_SERVER_URL': os.environ.get('T58_LICENSE_SERVER_URL', ''),
              'MASTER_LICENSE_KEY_HASH': os.environ.get('T58_MASTER_LICENSE_KEY_HASH', ''),
          }
          header = ('# AUTO-GENERATED at build time by the release workflow from the '
                    'T58_LICENSE_SERVER_URL / T58_MASTER_LICENSE_KEY_HASH repo secrets. '
                    'Never edit by hand; never commit (see .gitignore).\n')
          lines = [header] + [f'{k} = {json.dumps(v)}' for k, v in config.items()]
          os.makedirs('app/licensing', exist_ok=True)
          open('app/licensing/build_config.py', 'w', encoding='ascii').write('\n'.join(lines) + '\n')
          print('Wrote app/licensing/build_config.py -- URL set: %s, master-key hash set: %s'
                % (bool(config['LICENSE_SERVER_URL']), bool(config['MASTER_LICENSE_KEY_HASH'])))
          if not config['LICENSE_SERVER_URL']:
              print('WARNING: T58_LICENSE_SERVER_URL secret is not set -- this build will fail '
                    'loudly at startup (no license server URL configured). See license_server/DEPLOY.md.')
          "
        env:
          T58_LICENSE_SERVER_URL: ${{ secrets.T58_LICENSE_SERVER_URL }}
          T58_MASTER_LICENSE_KEY_HASH: ${{ secrets.T58_MASTER_LICENSE_KEY_HASH }}

      - name: Build Windows executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name "T58-Quant-Algo-Backtester" `
            --paths . `
            --hidden-import "pandas" `
            --hidden-import "numpy" `
            --hidden-import "app" `
            --hidden-import "app.ui" `
            --hidden-import "app.ui.main_window" `
            --hidden-import "app.ui.condition_builder" `
            --hidden-import "app.ui.onboarding_tour" `
            --hidden-import "app.strategy" `
            --hidden-import "app.strategy.manual" `
            --hidden-import "app.strategy.expr" `
            --hidden-import "app.strategy.indicators" `
            --hidden-import "app.strategy.base" `
            --hidden-import "app.strategy.mql5" `
            --hidden-import "app.strategy.pinescript" `
            --hidden-import "app.strategy.python" `
            --hidden-import "app.ai" `
            --hidden-import "app.ai.ollama_client" `
            --hidden-import "app.ai.ollama_settings" `
            --hidden-import "requests" `
            --hidden-import "app.backtest" `
            --hidden-import "app.backtest.engine" `
            --hidden-import "app.backtest.risk" `
            --hidden-import "app.backtest.statistics" `
            --hidden-import "app.backtest.execution" `
            --hidden-import "app.data" `
            --hidden-import "app.data.importer" `
            --hidden-import "app.data.storage" `
            --hidden-import "app.data.multi_timeframe" `
            --hidden-import "app.monte_carlo" `
            --hidden-import "app.monte_carlo.engine" `
            --hidden-import "app.prop" `
            --hidden-import "app.prop.simulator" `
            --hidden-import "app.reports" `
            --hidden-import "app.reports.generator" `
            --hidden-import "app.reports.charts" `
            --hidden-import "app.reports._assets" `
            --hidden-import "app.reports.run_history" `
            --hidden-import "app.evolution" `
            --hidden-import "app.evolution.engine" `
            --hidden-import "app.evolution.checkpoint" `
            --hidden-import "app.evolution.knowledge_graph" `
            --hidden-import "app.evolution.prop_fitness" `
            --collect-all "py7zr" `
            --collect-all "pyarrow" `
            --add-data "data/examples;data/examples" `
            --add-data "app/ui/assets;app/ui/assets" `
            --add-data "strategies;strategies" `
            run_app.py

      - name: Verify executable
        shell: pwsh
        run: |
          Write-Host "=== VERIFYING EXE ==="

          if (-not (Test-Path "dist\T58-Quant-Algo-Backtester.exe")) {
            Write-Error "Executable was not created."
            exit 1
          }

          $exe = Get-Item "dist\T58-Quant-Algo-Backtester.exe"

          Write-Host "EXE CREATED:"
          Write-Host "Path: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Code-sign the executable (optional)
        shell: pwsh
        run: |
          # P0-7 (Oct 2026): sign the built .exe with signtool so Windows
          # SmartScreen doesn't block every non-technical buyer. Runs BEFORE
          # packaging so the signed exe is what gets copied into release\.
          #
          # Owen has NO code-signing certificate yet: until the SIGN_CERT
          # (base64-encoded .pfx) and SIGN_CERT_PASSWORD repository secrets
          # are created, this step prints the notice below and EXITS 0 --
          # the build is NOT broken by the missing cert; it just ships
          # unsigned. To enable signing, add the two secrets and this step
          # signs dist\T58-Quant-Algo-Backtester.exe in place.
          $certB64 = "${{ secrets.SIGN_CERT }}"
          if ([string]::IsNullOrWhiteSpace($certB64)) {
            Write-Host "SIGN_CERT secret is not set -- skipping code signing (no certificate configured yet). The build continues UNSIGNED."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "t58-sign-cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($certB64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found -- install the Windows SDK on the runner image." }
            & $signtool sign /f $pfxPath /p "${{ secrets.SIGN_CERT_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\T58-Quant-Algo-Backtester.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)." }
            Write-Host "Signed dist\T58-Quant-Algo-Backtester.exe."
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create application package
        shell: pwsh
        run: |
          Write-Host "=== CREATING RELEASE PACKAGE ==="

          Remove-Item -Recurse -Force "release" -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "release" | Out-Null
          New-Item -ItemType Directory -Force -Path "release\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "release\data\examples" | Out-Null
          New-Item -ItemType Directory -Force -Path "release\data\raw" | Out-Null
          New-Item -ItemType Directory -Force -Path "release\strategies" | Out-Null

          Copy-Item `
            "dist\T58-Quant-Algo-Backtester.exe" `
            "release\T58-Quant-Algo-Backtester.exe" `
            -Force

          if (Test-Path "data\examples") {
            $exampleFiles = Get-ChildItem "data\examples" -File -ErrorAction SilentlyContinue

            if ($exampleFiles.Count -gt 0) {
              Copy-Item `
                "data\examples\*" `
                "release\data\examples\" `
                -Recurse `
                -Force
            }
          }

          if (Test-Path "data\raw") {
            $rawFiles = Get-ChildItem "data\raw" -File -Recurse -ErrorAction SilentlyContinue

            if ($rawFiles.Count -gt 0) {
              Copy-Item `
                "data\raw\*" `
                "release\data\raw\" `
                -Recurse `
                -Force
            }
          }

          if (Test-Path "strategies") {
            $strategyFiles = Get-ChildItem "strategies" -File -Recurse -ErrorAction SilentlyContinue

            if ($strategyFiles.Count -gt 0) {
              Copy-Item `
                "strategies\*" `
                "release\strategies\" `
                -Recurse `
                -Force
            }
          }

          Write-Host ""
          Write-Host "=== FINAL RELEASE STRUCTURE ==="

          Get-ChildItem "release" -Recurse |
            Select-Object FullName, Length

      - name: Verify packaged CSV files
        shell: pwsh
        run: |
          Write-Host "=== VERIFYING PACKAGED DATA ==="

          $rawFiles = Get-ChildItem "release\data\raw" -File -Recurse -ErrorAction SilentlyContinue

          if ($rawFiles.Count -eq 0) {
            Write-Warning "No CSV files were packaged into release/data/raw."
          }
          else {
            Write-Host "Packaged $($rawFiles.Count) CSV file(s) into release/data/raw (including instrument subfolders):"
            $rawFiles |
              Where-Object { $_.Extension -ieq ".csv" } |
              Select-Object FullName, Length
          }

      - name: Verify packaged strategy files
        shell: pwsh
        run: |
          Write-Host "=== VERIFYING PACKAGED STRATEGIES ==="

          $strategyFiles = Get-ChildItem "release\strategies" -File -Recurse -ErrorAction SilentlyContinue

          if ($strategyFiles.Count -eq 0) {
            Write-Warning "No strategy files were packaged into release\strategies. The built-in Strategy Library will be empty on first run."
          }
          else {
            Write-Host "Packaged $($strategyFiles.Count) strategy file(s) into release\strategies:"
            $strategyFiles | Select-Object FullName, Length
          }

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release\*" `
            -DestinationPath "T58-Quant-Algo-Backtester-Windows.zip" `
            -Force

          Write-Host ""
          Write-Host "=== ZIP CREATED ==="

          $zip = Get-Item "T58-Quant-Algo-Backtester-Windows.zip"

          Write-Host "Path: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Publish SHA-256 checksum
        # v7: the desktop updater (app/accounts/app_info.py) refuses any
        # download whose release has no checksum asset -- these zips used
        # to ship with no checksum at all, so in-app updates never
        # worked. Writes '<hex>  <filename>' lines (parsed by
        # _published_sha256_for()); the '.sha256' name is what
        # _find_checksum_asset() matches on the release assets.
        shell: pwsh
        run: |
          $zip = "T58-Quant-Algo-Backtester-Windows.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Write-Host "Checksum written to $zip.sha256 : $hash"

      - name: Upload Windows application
        uses: actions/upload-artifact@v4
        with:
          name: T58-Quant-Algo-Backtester-Windows
          path: |
            T58-Quant-Algo-Backtester-Windows.zip
            T58-Quant-Algo-Backtester-Windows.zip.sha256
          if-no-files-found: error

      - name: Attach Windows application to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            T58-Quant-Algo-Backtester-Windows.zip
            T58-Quant-Algo-Backtester-Windows.zip.sha256
