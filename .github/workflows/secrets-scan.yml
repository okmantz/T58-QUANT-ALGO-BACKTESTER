# P2-8 (Oct 2026): secret scanning. This repo has shipped a hardcoded
# license backdoor hash before (since removed) and carries placeholder
# credential files in its history -- a scanner in CI makes sure no key,
# token, or password ever lands in a commit again. The official gitleaks
# action scans the full history on every push/PR; it fails the run on a
# finding. If it ever flags a false positive, add a .gitleaks.toml with
# an [allowlist] rather than disabling this workflow.
name: secrets-scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
