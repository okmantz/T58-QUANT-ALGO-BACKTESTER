name: build-web-exe

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch: {}

# FIX (2026-09, "this has been loading/compiling for over an hour --
# that's not normal"): see build.yml's own concurrency block for the
# full reasoning -- the short version is that several commits pushed
# close together used to each queue their own complete run of this
# workflow with nothing canceling the older, now-stale one.
concurrency:
  group: build-web-exe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # FIX (2026-09, root cause of the hour-plus hangs): this workflow's
  # "Run test suite" gate against the FULL 2000+-test suite used to run
  # directly on windows-latest, inside the same job that then runs
  # PyInstaller. Windows runners are dramatically slower than Linux for
  # this kind of numpy/pandas-heavy workload (no manylinux wheels to
  # reuse as-is, slower filesystem/process-spawn overhead for a suite
  # this size), so a suite that takes 25-30+ minutes on Linux (see
  # build.yml, which already gates every push this same way -- and see
  # that workflow's own timeout-minutes comment for how that runtime has
  # grown as the suite grew) could take well over an hour here -- and
  # because the exe build itself couldn't even START until that finished,
  # the whole workflow sat "in progress" the entire time with no visible
  # sign of whether it was working or stuck. Splitting the test gate into
  # its OWN fast ubuntu-latest job that the Windows build job depends on
  # (needs:) keeps exactly the same protection (a red test suite still
  # blocks the release exe -- see the windows job's own comment) while
  # removing the slow-OS re-run entirely from the critical path.
  test:
    runs-on: ubuntu-latest
    # See build.yml's matching timeout-minutes comment: 30 was too tight
    # once the suite grew past ~2000 tests and started getting killed by
    # the timeout itself (shown as "cancelled") rather than by a real
    # failure. 60 gives real headroom.
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install pytest
      - name: Run test suite
        run: pytest -q tests

  build-windows-web-exe:
    needs: test
    runs-on: windows-latest
    # The exe build itself (dependency install + PyInstaller packaging,
    # no test suite anymore -- see the `test` job above) should be well
    # under this; a real hang here now fails loudly instead of running
    # for hours.
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          # pwsh does NOT stop on a failed native command (non-zero exit)
          # the way bash does -- a failing `pip install` here would
          # otherwise be silently ignored and the workflow would carry on
          # to build an .exe missing whatever didn't install (this is
          # exactly what happened when config/requirements.txt briefly had
          # an unsatisfiable version pin: pip failed, PyInstaller still
          # ran, and the resulting .exe crashed on first launch with
          # "No module named 'pandas'"). Check $LASTEXITCODE after every
          # pip call so a resolution failure stops the build immediately.
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed (exit $LASTEXITCODE)" }
          pip install -r config/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install -r config/requirements.txt failed (exit $LASTEXITCODE) -- check for an unsatisfiable version pin" }
          pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "pip install pyinstaller failed (exit $LASTEXITCODE)" }

      - name: Verify critical dependencies actually imported
        shell: pwsh
        run: |
          # Belt-and-suspenders check: even if pip reports success, make
          # sure every package the app actually imports at runtime is
          # really importable before we spend time building an .exe out of
          # it. This would have caught the pandas-missing build instantly
          # instead of only surfacing when Owen launched the app.
          python -c "import pandas, numpy, flask, alpaca, keyring, qrcode, requests, pyarrow, py7zr, pypdf, scipy, sklearn, lightgbm; print('All critical dependencies import OK')"
          if ($LASTEXITCODE -ne 0) { throw "One or more required Python packages failed to import after installation -- building would produce a broken .exe. Check config/requirements.txt." }

      - name: Verify repository structure
        shell: pwsh
        run: |
          Write-Host "=== VERIFYING REPOSITORY ==="

          if (-not (Test-Path "run_web.py")) {
            Write-Error "run_web.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\web\server.py")) {
            Write-Error "app/web/server.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\web\launcher.py")) {
            Write-Error "app/web/launcher.py was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\web\templates")) {
            Write-Error "app/web/templates was NOT found."
            exit 1
          }

          if (-not (Test-Path "app\web\static")) {
            Write-Error "app/web/static was NOT found."
            exit 1
          }

      - name: Build Windows web-app executable
        shell: pwsh
        run: |
          pyinstaller `
            --noconfirm `
            --clean `
            --onefile `
            --console `
            --name "T58-Web-App" `
            --paths . `
            --hidden-import "pandas" `
            --hidden-import "numpy" `
            --hidden-import "flask" `
            --hidden-import "app" `
            --hidden-import "app.web" `
            --hidden-import "app.web.server" `
            --hidden-import "app.web.launcher" `
            --hidden-import "app.strategy" `
            --hidden-import "app.strategy.manual" `
            --hidden-import "app.strategy.expr" `
            --hidden-import "app.strategy.indicators" `
            --hidden-import "app.strategy.base" `
            --hidden-import "app.strategy.mql5" `
            --hidden-import "app.strategy.pinescript" `
            --hidden-import "app.strategy.python" `
            --hidden-import "app.ai" `
            --hidden-import "app.ai.ollama_client" `
            --hidden-import "app.ai.ollama_settings" `
            --hidden-import "requests" `
            --hidden-import "app.backtest" `
            --hidden-import "app.backtest.engine" `
            --hidden-import "app.backtest.risk" `
            --hidden-import "app.backtest.statistics" `
            --hidden-import "app.backtest.execution" `
            --hidden-import "app.data" `
            --hidden-import "app.data.importer" `
            --hidden-import "app.data.storage" `
            --hidden-import "app.data.multi_timeframe" `
            --hidden-import "app.monte_carlo" `
            --hidden-import "app.monte_carlo.engine" `
            --hidden-import "app.prop" `
            --hidden-import "app.prop.simulator" `
            --hidden-import "app.reports" `
            --hidden-import "app.reports.generator" `
            --hidden-import "app.reports.charts" `
            --hidden-import "app.reports._assets" `
            --hidden-import "app.reports.run_history" `
            --hidden-import "app.evolution" `
            --hidden-import "app.evolution.engine" `
            --hidden-import "app.evolution.checkpoint" `
            --hidden-import "app.evolution.knowledge_graph" `
            --hidden-import "app.evolution.prop_fitness" `
            --collect-all "py7zr" `
            --collect-all "pyarrow" `
            --hidden-import "qrcode" `
            --hidden-import "PIL" `
            --add-data "app/web/templates;app/web/templates" `
            --add-data "app/web/static;app/web/static" `
            --add-data "data/examples;data/examples" `
            --add-data "strategies;strategies" `
            run_web.py

      - name: Verify executable
        shell: pwsh
        run: |
          Write-Host "=== VERIFYING EXE ==="

          if (-not (Test-Path "dist\T58-Web-App.exe")) {
            Write-Error "Executable was not created."
            exit 1
          }

          $exe = Get-Item "dist\T58-Web-App.exe"

          Write-Host "EXE CREATED:"
          Write-Host "Path: $($exe.FullName)"
          Write-Host "Size: $($exe.Length) bytes"

      - name: Code-sign the executable (optional)
        shell: pwsh
        run: |
          # P0-7 (Oct 2026): sign the built web .exe with signtool so
          # Windows SmartScreen doesn't block every non-technical buyer.
          # Runs BEFORE packaging so the signed exe is what gets copied.
          #
          # Owen has NO code-signing certificate yet: until the SIGN_CERT
          # (base64-encoded .pfx) and SIGN_CERT_PASSWORD repository secrets
          # are created, this step prints the notice below and EXITS 0 --
          # the build is NOT broken by the missing cert; it just ships
          # unsigned. To enable signing, add the two secrets and this step
          # signs dist\T58-Web-App.exe in place.
          $certB64 = "${{ secrets.SIGN_CERT }}"
          if ([string]::IsNullOrWhiteSpace($certB64)) {
            Write-Host "SIGN_CERT secret is not set -- skipping code signing (no certificate configured yet). The build continues UNSIGNED."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "t58-sign-cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($certB64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found -- install the Windows SDK on the runner image." }
            & $signtool sign /f $pfxPath /p "${{ secrets.SIGN_CERT_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\T58-Web-App.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)." }
            Write-Host "Signed dist\T58-Web-App.exe."
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create application package
        shell: pwsh
        run: |
          Write-Host "=== CREATING RELEASE PACKAGE ==="

          Remove-Item -Recurse -Force "release-web" -ErrorAction SilentlyContinue

          New-Item -ItemType Directory -Force -Path "release-web" | Out-Null
          New-Item -ItemType Directory -Force -Path "release-web\data" | Out-Null
          New-Item -ItemType Directory -Force -Path "release-web\data\examples" | Out-Null
          New-Item -ItemType Directory -Force -Path "release-web\data\raw" | Out-Null
          New-Item -ItemType Directory -Force -Path "release-web\strategies" | Out-Null

          Copy-Item `
            "dist\T58-Web-App.exe" `
            "release-web\T58-Web-App.exe" `
            -Force

          if (Test-Path "data\examples") {
            $exampleFiles = Get-ChildItem "data\examples" -File -ErrorAction SilentlyContinue
            if ($exampleFiles.Count -gt 0) {
              Copy-Item "data\examples\*" "release-web\data\examples\" -Recurse -Force
            }
          }

          if (Test-Path "data\raw") {
            $rawFiles = Get-ChildItem "data\raw" -File -Recurse -ErrorAction SilentlyContinue
            if ($rawFiles.Count -gt 0) {
              Copy-Item "data\raw\*" "release-web\data\raw\" -Recurse -Force
            }
          }

          if (Test-Path "strategies") {
            $strategyFiles = Get-ChildItem "strategies" -File -Recurse -ErrorAction SilentlyContinue
            if ($strategyFiles.Count -gt 0) {
              Copy-Item "strategies\*" "release-web\strategies\" -Recurse -Force
            }
          }

          Copy-Item "HOW_TO_OPEN_ON_YOUR_PHONE.md" "release-web\HOW_TO_OPEN_ON_YOUR_PHONE.md" -Force -ErrorAction SilentlyContinue

          Write-Host ""
          Write-Host "=== FINAL RELEASE STRUCTURE ==="
          Get-ChildItem "release-web" -Recurse | Select-Object FullName, Length

      - name: Create ZIP package
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "release-web\*" `
            -DestinationPath "T58-Web-App-Windows.zip" `
            -Force

          Write-Host ""
          Write-Host "=== ZIP CREATED ==="
          $zip = Get-Item "T58-Web-App-Windows.zip"
          Write-Host "Path: $($zip.FullName)"
          Write-Host "Size: $($zip.Length) bytes"

      - name: Upload Windows web-app package
        uses: actions/upload-artifact@v4
        with:
          name: T58-Web-App-Windows
          path: T58-Web-App-Windows.zip
          if-no-files-found: error

      - name: Attach Windows web-app package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: T58-Web-App-Windows.zip
