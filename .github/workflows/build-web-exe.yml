name: build-web-exe

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch: {}

# A newer push cancels the stale run for the same ref instead of letting
# several full runs pile up (see build.yml for the full reasoning).
concurrency:
  group: build-web-exe-${{ github.ref }}
  cancel-in-progress: true

# PACKAGING CHANGES (2026-10-14) -- same fixes as build-exe.yml, see the note
# at the top of that file: one-folder build from build_tools/t58_web.spec,
# market data shipped separately (T58-Market-Data.zip), zip written by
# build_tools/package_release.py, and the frozen exe is really started and
# asked for its pages in CI (build_tools/frozen_smoke.py) before it ships.
# The old command line also forgot app/ui/assets and config/.

jobs:
  # The full test suite runs on Linux (much faster than Windows runners) and
  # gates the Windows build below.
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r config/requirements.txt
          pip install pytest
      - name: Run test suite
        run: pytest -q tests

  build-windows-web-exe:
    needs: test
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: config/requirements.txt

      - name: Install dependencies
        shell: pwsh
        run: |
          # pwsh does NOT stop on a failed native command, so every pip call is
          # checked explicitly -- a failed install must stop the build instead
          # of producing an exe that crashes with "No module named ...".
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed (exit $LASTEXITCODE)" }
          pip install -r config/requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "pip install -r config/requirements.txt failed (exit $LASTEXITCODE) -- check for an unsatisfiable version pin" }
          pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "pip install pyinstaller failed (exit $LASTEXITCODE)" }

      - name: Verify critical dependencies actually imported
        shell: pwsh
        run: |
          python -c "import pandas, numpy, flask, alpaca, keyring, qrcode, requests, pyarrow, py7zr, pypdf, scipy, sklearn, lightgbm; print('All critical dependencies import OK')"
          if ($LASTEXITCODE -ne 0) { throw "One or more required Python packages failed to import after installation -- building would produce a broken .exe. Check config/requirements.txt." }

      - name: Verify repository structure
        shell: pwsh
        run: |
          $required = @(
            "run_web.py",
            "app\web\server.py",
            "app\web\launcher.py",
            "app\web\templates",
            "app\web\static",
            "build_tools\t58_web.spec",
            "build_tools\spec_common.py",
            "build_tools\package_release.py",
            "build_tools\frozen_smoke.py",
            "config\pyproject.toml",
            "data\examples",
            "strategies"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error ("Missing from the repository: " + ($missing -join ", "))
            exit 1
          }
          Write-Host "Repository structure OK"

      - name: Bake license build config
        shell: pwsh
        run: |
          # Generates app/licensing/build_config.py from the release secrets
          # (T58_LICENSE_SERVER_URL, T58_MASTER_LICENSE_KEY_HASH). Both are
          # OPTIONAL: absent values are left empty and the app degrades loudly
          # at startup (see app/licensing/client.py and gate.py).
          python -c "
          import json, os
          config = {
              'LICENSE_SERVER_URL': os.environ.get('T58_LICENSE_SERVER_URL', ''),
              'MASTER_LICENSE_KEY_HASH': os.environ.get('T58_MASTER_LICENSE_KEY_HASH', ''),
          }
          header = ('# AUTO-GENERATED at build time by the release workflow from the '
                    'T58_LICENSE_SERVER_URL / T58_MASTER_LICENSE_KEY_HASH repo secrets. '
                    'Never edit by hand; never commit (see .gitignore).\n')
          lines = [header] + [f'{k} = {json.dumps(v)}' for k, v in config.items()]
          os.makedirs('app/licensing', exist_ok=True)
          open('app/licensing/build_config.py', 'w', encoding='ascii').write('\n'.join(lines) + '\n')
          print('Wrote app/licensing/build_config.py -- URL set: %s, master-key hash set: %s'
                % (bool(config['LICENSE_SERVER_URL']), bool(config['MASTER_LICENSE_KEY_HASH'])))
          if not config['LICENSE_SERVER_URL']:
              print('WARNING: T58_LICENSE_SERVER_URL secret is not set -- this build will fail '
                    'loudly at startup (no license server URL configured). See license_server/DEPLOY.md.')
          "
        env:
          T58_LICENSE_SERVER_URL: ${{ secrets.T58_LICENSE_SERVER_URL }}
          T58_MASTER_LICENSE_KEY_HASH: ${{ secrets.T58_MASTER_LICENSE_KEY_HASH }}

      - name: Build Windows web-app executable
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean build_tools/t58_web.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed (exit $LASTEXITCODE)" }

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "dist\T58-Web-App\T58-Web-App.exe"
          if (-not (Test-Path $exe)) { throw "Executable was not created: $exe" }
          if (-not (Test-Path "dist\T58-Web-App\_internal")) { throw "The _internal folder was not created next to the exe." }
          $item = Get-Item $exe
          Write-Host "EXE CREATED: $($item.FullName) ($($item.Length) bytes)"
          $total = (Get-ChildItem "dist\T58-Web-App" -Recurse -File | Measure-Object Length -Sum).Sum
          Write-Host ("Whole app folder: {0:N0} MB" -f ($total / 1MB))

      - name: Smoke-test the built exe
        shell: pwsh
        run: |
          # Starts the frozen web app, waits for its HTTP server, and requests
          # pages that need the bundled templates / static files. A build that
          # cannot start or cannot find its own files fails here.
          python build_tools/frozen_smoke.py web "dist\T58-Web-App\T58-Web-App.exe" 240
          if ($LASTEXITCODE -ne 0) { throw "The built exe failed its smoke test -- see the output above." }

      - name: Code-sign the executable (optional)
        shell: pwsh
        run: |
          # Skipped (exit 0) until the SIGN_CERT (base64 .pfx) and
          # SIGN_CERT_PASSWORD repository secrets exist -- the build then ships unsigned.
          $certB64 = "${{ secrets.SIGN_CERT }}"
          if ([string]::IsNullOrWhiteSpace($certB64)) {
            Write-Host "SIGN_CERT secret is not set -- skipping code signing (no certificate configured yet). The build continues UNSIGNED."
            exit 0
          }
          $pfxPath = Join-Path $env:RUNNER_TEMP "t58-sign-cert.pfx"
          try {
            [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($certB64))
            $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin" -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if (-not $signtool) { throw "signtool.exe not found -- install the Windows SDK on the runner image." }
            & $signtool sign /f $pfxPath /p "${{ secrets.SIGN_CERT_PASSWORD }}" /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 "dist\T58-Web-App\T58-Web-App.exe"
            if ($LASTEXITCODE -ne 0) { throw "signtool failed (exit $LASTEXITCODE)." }
            Write-Host "Signed dist\T58-Web-App\T58-Web-App.exe."
          } finally {
            Remove-Item $pfxPath -Force -ErrorAction SilentlyContinue
          }

      - name: Create ZIP package
        shell: pwsh
        run: |
          # The app only (exe + _internal + examples + strategies + docs).
          # Market data is a separate download: T58-Market-Data.zip.
          python build_tools/package_release.py app --dist "dist\T58-Web-App" --out "T58-Web-App-Windows.zip"
          if ($LASTEXITCODE -ne 0) { throw "Packaging failed -- see the file-name problems listed above." }
          $zip = Get-Item "T58-Web-App-Windows.zip"
          Write-Host ("ZIP CREATED: {0} ({1:N0} MB)" -f $zip.FullName, ($zip.Length / 1MB))

      - name: Publish SHA-256 checksum
        # The desktop updater (app/accounts/app_info.py) refuses any download
        # whose release has no checksum asset. Writes '<hex>  <filename>'
        # (parsed by _published_sha256_for()); the '.sha256' name is what
        # _find_checksum_asset() matches on the release assets.
        shell: pwsh
        run: |
          $zip = "T58-Web-App-Windows.zip"
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii "$zip.sha256"
          Write-Host "Checksum written to $zip.sha256 : $hash"

      - name: Upload Windows web-app package
        uses: actions/upload-artifact@v4
        with:
          name: T58-Web-App-Windows
          path: |
            T58-Web-App-Windows.zip
            T58-Web-App-Windows.zip.sha256
          compression-level: 0
          if-no-files-found: error

      - name: Attach Windows web-app package to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            T58-Web-App-Windows.zip
            T58-Web-App-Windows.zip.sha256
